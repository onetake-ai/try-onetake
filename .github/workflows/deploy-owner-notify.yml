name: Deploy Owner Notify Edge Script

# Secrets are set in the Bunny dashboard (Edge Scripts → 100963 → Env), not here:
# see the header of edge-scripts/owner-notify.ts.

on:
  push:
    branches:
      - main
    paths:
      - 'edge-scripts/owner-notify.ts'

permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Publish the script to Bunny
        uses: "BunnyWay/actions/deploy-script@main"
        with:
          script_id: 100963
          file: "edge-scripts/owner-notify.ts"
