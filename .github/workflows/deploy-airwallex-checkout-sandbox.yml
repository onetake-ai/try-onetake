name: Deploy Airwallex Checkout Edge Script (demo)

# Same file as the live script, run with AIRWALLEX_SANDBOX=1 and the Airwallex demo credentials
# set in the Bunny dashboard for the demo script. Replace script_id with the demo script's ID.

# Manual until the placeholder is replaced; then switch the trigger to the same push rule as the live workflow.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install
        run: ""

      - name: Build
        run: ""

      - name: Publish the script to Bunny
        uses: "BunnyWay/actions/deploy-script@main"
        with:
          script_id: 0   # PLACEHOLDER: ID of the demo Bunny script
          file: "edge-scripts/airwallex-checkout.ts"
