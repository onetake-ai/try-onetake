name: Deploy Calendar Proxy Edge Script

# Set the repository variable CALENDAR_PROXY_SCRIPT_ID (Settings → Secrets and variables →
# Actions → Variables) to the Bunny script's numeric ID: until then, this workflow is skipped.
# See the header of edge-scripts/calendar-proxy.ts.

on:
  push:
    branches:
      - main
    paths:
      - 'edge-scripts/calendar-proxy.ts'

permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest
    if: ${{ vars.CALENDAR_PROXY_SCRIPT_ID != '' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install
        run: ""

      - name: Build
        run: ""

      - name: Publish the script to Bunny
        uses: "BunnyWay/actions/deploy-script@main"
        with:
          script_id: ${{ vars.CALENDAR_PROXY_SCRIPT_ID }}
          file: "edge-scripts/calendar-proxy.ts"
